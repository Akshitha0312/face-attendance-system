<!DOCTYPE html>
<html>
<head>
    <title>Face Recognition Attendance</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: url('/static/bg.jpg') no-repeat center center/cover;
        }

        /* 🔥 Overlay for readability */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 40px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .btn {
            padding: 15px 35px;
            border-radius: 30px;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.9);
            color: #4e73df;
            backdrop-filter:blur(5px);
            background: white;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            background: #f8f9fc;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
<div class="overlay"></div>
<div class="container">
    <h1>Face Recognition Attendance System</h1>

    <div class="buttons">
        <a href="/login" class="btn">Admin Login</a>
        <a href="/student_login" class="btn">Student Login</a>
    </div>
</div>

<div class="footer">
    Powered by OpenCV + Flask
</div>

</body>
</html>
