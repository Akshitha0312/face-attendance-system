<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>
<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#36b9cc,#f6c23e);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:white;
    padding:40px;
    border-radius:15px;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}
h2{
    color:#36b9cc;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
}
button{
    width:100%;
    padding:12px;
    background:#36b9cc;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
}
.msg{
    color:red;
}
</style>
</head>

<body>
<div class="card">
<h2>Student Login</h2>

<form method="POST">
<input name="roll_no" placeholder="Roll No" required>
<input name="password" type="password" required>
<button>Login</button>
</form>

<div class="msg">{{ message }}</div>
</div>
</body>
</html>
